author: DKSec Platform
date: 2026/09/17
description: Detects web injection, reconnaissance, and token abuse identified during
  DKSec security audit.
detection:
  condition: selection_sqli or selection_recon
  selection_recon:
    c-uri|contains:
    - /.env
    - /.git
    - /actuator/env
    - /backup.sql
  selection_sqli:
    c-uri|contains:
    - UNION SELECT
    - 1=1
    - sleep(
falsepositives:
- Authorized Penetration Testing and Security Audits
id: e7b1a2c3-4d5e-6f7a-8b9c-0d1e2f3a4b5c
level: high
logsource:
  category: webserver
references:
- https://github.com/SigmaHQ/sigma
status: experimental
tags:
- attack.initial_access
- attack.t1190
- attack.t1595
title: Web Application Attack Signatures for Fintech Core Banking Demo
